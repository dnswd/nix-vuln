[package]
name = "nix-vuln"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
mime_guess = "2.0.5"
nix-derivation = "0.6.1"
redb = "4.4.0"
regex = "1.13.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
